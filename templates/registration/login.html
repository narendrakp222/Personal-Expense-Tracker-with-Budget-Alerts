{% extends "base.html" %}

{% block content %}

<div class="auth-wrapper">

    <div class="auth-card">

        <div class="text-center mb-4">

            <h1 class="fw-bold">
                Welcome Back 👋
            </h1>

            <p class="text-muted">
                Login to manage your expenses and budgets.
            </p>

        </div>

        <form method="post">

            {% csrf_token %}

            {% for field in form %}

            <div class="mb-3">

                <label class="form-label fw-semibold">
                    {{ field.label }}
                </label>

                {{ field }}

                {% if field.errors %}
                <div class="text-danger small mt-1">
                    {{ field.errors }}
                </div>
                {% endif %}

            </div>

            {% endfor %}

            <button class="btn btn-primary w-100">
                Login
            </button>

        </form>

        <div class="text-center mt-4">

            <span class="text-muted">
                Don't have an account?
            </span>

            <a href="{% url 'register' %}">
                Register
            </a>

        </div>

    </div>

</div>

{% endblock %}
