{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h1>Expenses</h1>
  <a class="btn btn-primary" href="{% url 'expense_create' %}">Add Expense</a>
</div>
<div class="table-responsive"><table class="table table-striped table-bordered align-middle">
  <thead><tr><th>Date</th><th>Category</th><th>Amount</th><th>Notes</th><th>Actions</th></tr></thead>
  <tbody>{% for expense in expenses %}<tr><td>{{ expense.date }}</td><td>{{ expense.category.name }}</td><td>{{ expense.amount }}</td><td>{{ expense.notes }}</td><td><a class="btn btn-sm btn-warning" href="{% url 'expense_update' expense.id %}">Edit</a> <a class="btn btn-sm btn-danger" href="{% url 'expense_delete' expense.id %}">Delete</a></td></tr>{% empty %}<tr><td colspan="5" class="text-center">No expenses yet.</td></tr>{% endfor %}</tbody>
</table></div>
{% endblock %}
