{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h1>Budgets</h1>
  <a class="btn btn-primary" href="{% url 'budget_create' %}">Add Budget</a>
</div>
<div class="table-responsive">
  <table class="table table-striped table-bordered align-middle">
    <thead><tr><th>Category</th><th>Monthly Limit</th><th>Month</th><th>Actions</th></tr></thead>
    <tbody>
      {% for budget in budgets %}
      <tr>
        <td>{{ budget.category.name }}</td>
        <td>{{ budget.monthly_limit }}</td>
        <td>{{ budget.month_year|date:"F Y" }}</td>
        <td>
          <a class="btn btn-sm btn-warning" href="{% url 'budget_update' budget.id %}">Edit</a>
          <a class="btn btn-sm btn-danger" href="{% url 'budget_delete' budget.id %}">Delete</a>
        </td>
      </tr>
      {% empty %}
      <tr><td colspan="4" class="text-center">No budgets yet.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
